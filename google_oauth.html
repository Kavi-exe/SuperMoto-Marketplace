<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Google – CeylonSuperHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body {
            background: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1f1f1f;
        }
        .card {
            background: #fff;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            padding: 40px 36px 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }
        .header { text-align: center; margin-bottom: 28px; }
        .google-logo { margin-bottom: 16px; }
        h1 { font-size: 1.4rem; font-weight: 400; color: #1f1f1f; margin-bottom: 6px; }
        .sub { font-size: 0.88rem; color: #444746; }
        .sub strong { color: #1a6fff; font-weight: 500; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        label { font-size: 0.82rem; font-weight: 500; color: #444746; }
        input {
            border: 1.5px solid #c4c7c5;
            border-radius: 6px;
            padding: 11px 14px;
            font-size: 0.95rem;
            color: #1f1f1f;
            outline: none;
            width: 100%;
            transition: border-color 0.15s;
        }
        input:focus { border-color: #0b57d0; }
        .error { color: #d93025; font-size: 0.82rem; min-height: 1em; margin-top: -8px; margin-bottom: 4px; }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
        }
        .btn-text {
            background: transparent;
            border: none;
            color: #0b57d0;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .btn-text:hover { background: #f1f3f4; }
        .btn-primary {
            background: #0b57d0;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 100px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary:hover { background: #0842a0; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; color: #c4c7c5; font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e0e0; }
        .loader { display: none; text-align: center; padding: 20px 0; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #f0f0f0;
            border-top-color: #0b57d0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { margin-top: 28px; display: flex; justify-content: space-between; font-size: 0.72rem; color: #747775; }
        .footer a { color: inherit; text-decoration: none; margin-left: 10px; }
        .footer a:hover { color: #1f1f1f; }
    </style>
</head>
<body>
<div class="card">
    <div id="main-view">
        <div class="header">
            <svg class="google-logo" width="74" height="24" viewBox="0 0 74 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M11.5 6c-3 0-5.5 2.5-5.5 5.5S8.5 17 11.5 17s5.5-2.5 5.5-5.5S14.5 6 11.5 6zm0 9c-1.6 0-3-1.3-3-3s1.4-3 3-3 3 1.3 3 3-1.4 3-3 3z"/>
                <path fill="#FBBC05" d="M24 6c-3 0-5.5 2.5-5.5 5.5S21 17 24 17s5.5-2.5 5.5-5.5S27 6 24 6zm0 9c-1.6 0-3-1.3-3-3s1.4-3 3-3 3 1.3 3 3-1.4 3-3 3z"/>
                <path fill="#4285F4" d="M36.2 6c-2.9 0-5.2 2.4-5.2 5.5s2.3 5.5 5.2 5.5c1.4 0 2.5-.5 3.3-1.3v1c0 2.1-1.1 3.2-2.9 3.2-1.5 0-2.4-1.1-2.8-2l-2.5 1c.7 1.8 2.7 3.9 5.3 3.9 3.1 0 5.7-1.8 5.7-5.8V6.3h-3v1.2c-.8-.9-1.9-1.5-3.1-1.5zm-.1 9c-1.6 0-2.8-1.3-2.8-3s1.2-3 2.8-3 2.8 1.3 2.8 3-1.2 3-2.8 3z"/>
                <path fill="#34A853" d="M44.5.3h3V23h-3z"/>
                <path fill="#EA4335" d="M54.5 15c-1.4 0-2.4-.6-3-1.9l8.3-3.4-.3-.7c-.6-1.6-2.4-4.5-5.7-4.5-3.3 0-6.1 2.6-6.1 5.5a5.5 5.5 0 005.5 5.5c2.7 0 4.2-1.7 4.9-2.6l-2.4-1.6c-.8 1.1-1.8 1.8-3.2 1.8zm-.2-6.5c1.1 0 2 .5 2.3 1.3l-5.6 2.3c0-2.2 1.6-3.6 3.3-3.6z"/>
            </svg>
            <h1>Sign in with Google</h1>
            <p class="sub">to continue to <strong>CeylonSuperHub</strong></p>
        </div>

        <form id="oauth-form" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="g-name">Full Name</label>
                <input type="text" id="g-name" placeholder="Your full name" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="g-email">Email address</label>
                <input type="email" id="g-email" placeholder="you@gmail.com" required autocomplete="email">
            </div>
            <p class="error" id="form-error"></p>
            <div class="actions">
                <button type="button" class="btn-text" onclick="window.close()">Cancel</button>
                <button type="submit" class="btn-primary" id="submit-btn">Continue</button>
            </div>
        </form>

        <div class="footer">
            <span>English</span>
            <div>
                <a href="#">Help</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
            </div>
        </div>
    </div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p style="font-size:0.88rem;color:#444746">Completing sign-in…</p>
    </div>
</div>

<script>
    function submitForm(e) {
        e.preventDefault();
        const name  = document.getElementById('g-name').value.trim();
        const email = document.getElementById('g-email').value.trim();
        const errorEl = document.getElementById('form-error');

        if (!name) { errorEl.textContent = 'Please enter your name.'; return; }
        if (!email) { errorEl.textContent = 'Please enter your email.'; return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            errorEl.textContent = 'Please enter a valid email address.'; return;
        }
        errorEl.textContent = '';

        document.getElementById('submit-btn').disabled = true;
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('loader').style.display = 'block';

        setTimeout(() => {
            if (window.opener) {
                window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', name, email }, '*');
            }
            window.close();
        }, 800);
    }
</script>
</body>
</html>
